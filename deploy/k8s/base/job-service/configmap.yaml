apiVersion: v1
kind: ConfigMap
metadata:
  name: job-service-config
  namespace: llm-mcp
data:
  SPRING_PROFILES_ACTIVE: k8s
  SPRING_DATASOURCE_URL: jdbc:postgresql://pg-rw.db.svc.cluster.local:5432/job_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: llm-mcp-kafka-bootstrap.kafka.svc.cluster.local:9092
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  # JVM sizes its heap from the cgroup limit (1Gi -> 768Mi heap); never hard-code -Xmx in a container
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm.observability.svc.cluster.local:4318
