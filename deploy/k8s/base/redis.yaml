# Cache + rate-limit buckets only: no persistence, so a plain Deployment (not a StatefulSet) is honest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: llm-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.1
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: llm-mcp
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
