apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-service
  namespace: llm-mcp
  labels:
    app: credit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-service
  template:
    metadata:
      labels:
        app: credit-service
    spec:
      # 30 s = Spring's graceful shutdown window + Kafka consumer leave: in-flight handlers commit, no rebalance storm
      terminationGracePeriodSeconds: 30
      containers:
        - name: credit-service
          image: llm-mcp/credit-service
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: credit-service-config
            - secretRef:
                name: app-secrets
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pg-credit
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credit
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # startup: give the JVM up to 60 s (30 x 2 s) before liveness may kill it; liveness never checks
          # dependencies (a restart cannot fix Kafka); readiness does (db/redis/kafka) and only gates traffic
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: credit-service
  namespace: llm-mcp
spec:
  selector:
    app: credit-service
  ports:
    - name: http
      port: 8082
      targetPort: http
