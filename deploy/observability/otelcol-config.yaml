# Collector config for grafana/otel-lgtm (replaces /otel-lgtm/otelcol-config.yaml). Same pipelines as
# the image default, plus a Prometheus receiver that scrapes the three services' /actuator/prometheus:
# traces and logs are PUSHED by the apps over OTLP, metrics are PULLED (Boot 4 ships no OTLP metrics
# auto-configuration; scraping keeps the Micrometer names the dashboards use).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]
  prometheus/services:
    config:
      scrape_configs:
        - job_name: "llm-mcp"
          scrape_interval: 10s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${env:SCRAPE_JOB_SERVICE}"]
              labels: { service: job-service }
            - targets: ["${env:SCRAPE_CREDIT_SERVICE}"]
              labels: { service: credit-service }
            - targets: ["${env:SCRAPE_LLM_WORKER}"]
              labels: { service: llm-worker }
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"
processors:
  batch:
exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector, prometheus/services]
      processors: [batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
