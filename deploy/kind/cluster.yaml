# kind cluster for Phase 6: one control-plane + one worker. Node image pinned by digest (kind v0.33.0
# release notes) — a tag alone can silently point at an image built for another kind release.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-mcp
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      - containerPort: 30080   # job-service NodePort in overlays/local -> http://localhost:30080
        hostPort: 30080
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
