spring:
  application:
    name: credit-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cache:
    type: redis
    # "credits" cache: TTL 5s, configured in CacheConfig
  kafka:
    template:
      observation-enabled: true    # producer span + traceparent header on every record
    listener:
      observation-enabled: true    # consumer span joins the trace found in the record headers
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000            # fail fast when the broker is unreachable (outbox retries next tick)
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: credit-service
      auto-offset-reset: earliest   # a new group starts from the beginning of the topic

server:
  port: 8082
  shutdown: graceful

management:
  # OpenTelemetry (ADR-0024): traces + logs pushed over OTLP/HTTP to the collector (otel-lgtm), metrics scraped
  # from /actuator/prometheus. Off unless OTEL_ENABLED=true, so a laptop without the collector logs no export errors.
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: ${OTEL_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${SPRING_PROFILES_ACTIVE:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: always
      group:
        readiness:
          include: readinessState,db,redis,kafka

logging:
  pattern:
    correlation: "[${spring.application.name},%X{traceId:-},%X{spanId:-},%X{jobId:-}] "

app:
  security:
    api-keys: ${APP_API_KEYS:local-dev-key}          # comma-separated; ROLE_USER
    admin-api-keys: ${APP_ADMIN_API_KEYS:local-admin-key} # ROLE_ADMIN (+USER)
  outbox:
    publisher: polling      # polling | cdc (cdc = Debezium reads the outbox table; poller disabled)
    poll-interval: 500ms
    batch-size: 100
    send-timeout: 10s
    retention: 7d
    retention-cron: "0 0 3 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
