# Kubernetes/GKE profile (Phase 6/7): JSON logs for Loki, secrets and hosts from the environment.
logging:
  structured:
    format:
      console: ecs        # Elastic Common Schema JSON; MDC (jobId) becomes a top-level field
spring:
  docker:
    compose:
      enabled: false
app:
  security:
    mcp-open: false       # /mcp behind the API key outside a laptop
