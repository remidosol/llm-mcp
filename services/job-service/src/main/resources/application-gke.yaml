# GKE additions on top of the k8s profile (SPRING_PROFILES_ACTIVE=k8s,gke): JSON logs for Loki.
logging:
  structured:
    format:
      console: ecs        # Elastic Common Schema JSON; MDC (jobId) becomes a top-level field
app:
  security:
    mcp-open: false       # /mcp behind the API key outside a laptop
