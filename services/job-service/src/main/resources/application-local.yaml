spring:
  kafka:
    bootstrap-servers: localhost:9092 # Boot 4.1 has no Kafka compose service connection - explicit
  docker:
    compose:
      file: ../../compose.yaml
      lifecycle-management: start-only   # start shared infra once, never stop it for the others
  datasource:
    # explicit per-service DB: the compose postgres carries org.springframework.boot.ignore
    url: jdbc:postgresql://localhost:5433/job_db # compose maps 5433 -> container 5432
    username: ${POSTGRES_USER:llm}
    password: ${POSTGRES_PASSWORD:llm-local}
  flyway:
    locations: classpath:db/migration,classpath:db/local   # V900 seed only in local

logging:
  level:
    org.springframework.cache: TRACE   # Phase 1 DoD: cache hits must be visible in logs

app:
  security:
    mcp-open: true            # Claude Code / MCP Inspector talk to /mcp without a key on a laptop
  saga:
    job-timeout: 20s          # demo-friendly: PRD default is 120s (see docs/runbook.md)
    watchdog-interval: 5s
