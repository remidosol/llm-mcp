# Tool versions for laptops and CI (jdx/mise-action). Java stays Temurin 21 (the build enforces [21,26)).
[env]
_.path = ["node_modules/.bin"]
DO_NOT_TRACK = 1

[settings]
experimental = true

[tools]
java = "temurin-21"
node = "24"
buck2 = "latest"
buildifier = "latest"
git-cliff = "latest"
opentofu = "latest"
